# Connection Pooling
listen_addresses = '*'
port = 9999
socket_dir = '/var/run/pgpool'
pcp_listen_addresses = '*'
pcp_port = 9898
pcp_socket_dir = '/var/run/pgpool'

# Connection Pool
num_init_children = 100
max_pool = 1
child_life_time = 300
child_max_connections = 0
connection_life_time = 0
client_idle_limit = 0

# Load Balancing
load_balance_mode = on
ignore_leading_white_space = on
read_only_function_list = ''
write_function_list = ''
primary_routing_query_pattern_list = ''
# Hasura compatibility: allow load balancing even after writes
disable_load_balance_on_write = 'off'

# Backend Configuration - Primary
backend_hostname0 = 'postgresql-prod-rw.aspe.svc.cluster.local'
backend_port0 = 5432
backend_weight0 = 0
backend_data_directory0 = '/var/lib/postgresql/data'
backend_flag0 = 'ALWAYS_PRIMARY|DISALLOW_TO_FAILOVER'
backend_application_name0 = 'primary'

# Backend Configuration - Replicas (load balanced)
backend_hostname1 = 'postgresql-prod-ro.aspe.svc.cluster.local'
backend_port1 = 5432
backend_weight1 = 1
backend_data_directory1 = '/var/lib/postgresql/data'
backend_flag1 = 'DISALLOW_TO_FAILOVER'
backend_application_name1 = 'replicas'

# Health Check (disabled - managed by CNPG)
health_check_period = 0
health_check_timeout = 20
health_check_user = ''
health_check_password = ''
health_check_max_retries = 3

# Backend authentication
sr_check_user = ''
sr_check_password = ''

# Failover (disabled - managed by CNPG)
failover_on_backend_error = off

# Logging
log_destination = 'stderr'
log_line_prefix = '%t: pid %p: '
log_connections = off
log_hostname = off
log_statement = off
log_per_node_statement = off
log_client_messages = off
log_standby_delay = 'none'

# Connection Settings
enable_pool_hba = on
pool_passwd = '/etc/pgpool-passwd/pool_passwd'
authentication_timeout = 60
allow_clear_text_frontend_auth = off
allow_sql_comments = on

# SSL (disabled for backend connections)
ssl = off

# Streaming Replication Check (disabled)
sr_check_period = 0

# Memory Cache (disabled)
memory_cache_enabled = off

# Statement level load balancing for Hasura prepared statements
statement_level_load_balance = on

# Work directories
memqcache_cache_block_size = 1048576
memqcache_oiddir = '/var/run/pgpool/oiddir'
logdir = '/var/run/pgpool'
